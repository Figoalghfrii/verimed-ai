name: VeriMed CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-ml:
    name: Backend & ML Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e "./apps/api[dev]"

      - name: Run Ruff lint and format checks
        run: |
          ruff check apps/api ml/evaluation scripts
          ruff format --check apps/api ml/evaluation scripts

      - name: Run backend and ML pytest suites
        run: pytest apps/api/tests ml/evaluation/test_evaluation_metrics.py -v

      - name: Run offline ML benchmarks (synthetic & curated)
        run: |
          python ml/evaluation/run_evaluation.py
          python ml/evaluation/run_evaluation.py --corpus ml/data/curated_public_health_corpus.json --benchmark ml/data/curated_benchmark_claims.json

  frontend:
    name: Frontend Typecheck, Unit & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm test

      - name: Run Next.js production build
        run: npm run build

      - name: Install Playwright Chromium and run E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
